<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat App</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f10;
      --surface: #1a1a1e;
      --border: #2e2e36;
      --accent: #7c6af7;
      --accent-soft: #7c6af720;
      --text: #e8e8f0;
      --muted: #6b6b7e;
      --system: #f0a04b;
      --radius: 12px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* ── Join Screen ── */
    #join-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 360px;
    }

    #join-screen h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    #join-screen h1 span { color: var(--accent); }

    #join-screen p {
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }

    #join-screen input {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #join-screen input:focus { border-color: var(--accent); }

    #join-screen button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #join-screen button:hover { opacity: 0.85; }

    /* ── Chat Screen ── */
    #chat-screen {
      display: none;
      width: 100%;
      max-width: 800px;
      height: 100%;
      max-height: 700px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      flex-direction: row;
    }

    /* Sidebar */
    #sidebar {
      width: 200px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    #sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    #sidebar-header h2 {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }

    #user-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.875rem;
      color: var(--text);
    }

    .user-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Main chat area */
    #chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #chat-header h1 {
      font-size: 1rem;
      font-weight: 600;
    }

    #chat-header span {
      font-size: 0.8rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 75%;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.own { align-self: flex-end; align-items: flex-end; }
    .msg.other { align-self: flex-start; }

    .msg-meta {
      font-size: 0.72rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      padding: 0 4px;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg.own .msg-bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.other .msg-bubble {
      background: #25252d;
      border-bottom-left-radius: 4px;
    }

    .system-msg {
      align-self: center;
      font-size: 0.78rem;
      color: var(--system);
      font-family: 'DM Mono', monospace;
      background: #f0a04b15;
      padding: 4px 12px;
      border-radius: 20px;
      animation: fadeUp 0.2s ease;
    }

    /* Input */
    #input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #msg-input {
      flex: 1;
      padding: 12px 16px;
      background: #25252d;
      border: 1px solid var(--border);
      border-radius: 30px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #msg-input:focus { border-color: var(--accent); }

    #send-btn {
      width: 44px;
      height: 44px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s;
    }

    #send-btn:hover { opacity: 0.85; }
    #send-btn:active { transform: scale(0.93); }

    #send-btn svg { width: 18px; height: 18px; fill: #fff; }

    @media (max-width: 500px) {
      #sidebar { display: none; }
      #chat-screen { border-radius: 16px; }
    }
  </style>
</head>
<body>

  <!-- Join Screen -->
  <div id="join-screen">
    <h1>Chat<span>App</span></h1>
    <p>Pick a username to jump into the conversation.</p>
    <input id="username-input" type="text" placeholder="Your username..." maxlength="20" autocomplete="off"/>
    <button onclick="joinChat()">Join Chat →</button>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen">
    <div id="sidebar">
      <div id="sidebar-header"><h2>Online</h2></div>
      <div id="user-list"></div>
    </div>
    <div id="chat-main">
      <div id="chat-header">
        <h1>General</h1>
        <span id="online-count">0 online</span>
      </div>
      <div id="messages"></div>
      <div id="input-area">
        <input id="msg-input" type="text" placeholder="Type a message..." autocomplete="off"/>
        <button id="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myUsername = '';

    // ── Join ──
    document.getElementById('username-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') joinChat();
    });

    function joinChat() {
      const input = document.getElementById('username-input');
      const username = input.value.trim();
      if (!username) return;

      myUsername = username;
      socket.emit('join', username);

      document.getElementById('join-screen').style.display = 'none';
      document.getElementById('chat-screen').style.display = 'flex';
      document.getElementById('msg-input').focus();
    }

    // ── Send ──
    document.getElementById('msg-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('message', text);
      input.value = '';
    }

    // ── Load message history on connect ──
    socket.on('history', (messages) => {
      messages.forEach(({ username, text, time }) => {
        appendMessage(username, text, time);
      });
    });

    // ── Receive messages ──
    socket.on('message', ({ username, text, time }) => {
      appendMessage(username, text, time);
    });

    function appendMessage(username, text, time) {
      const messages = document.getElementById('messages');
      const isOwn = username === myUsername;
      const div = document.createElement('div');
      div.className = `msg ${isOwn ? 'own' : 'other'}`;
      div.innerHTML = `
        <div class="msg-meta">${isOwn ? 'you' : username} · ${time}</div>
        <div class="msg-bubble">${escapeHtml(text)}</div>
      `;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    // ── System messages ──
    socket.on('system', ({ message }) => {
      const messages = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'system-msg';
      div.textContent = message;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    });

    // ── User list ──
    socket.on('userList', (users) => {
      const list = document.getElementById('user-list');
      const count = document.getElementById('online-count');
      list.innerHTML = users.map(u => `
        <div class="user-item">
          <div class="user-dot"></div>
          <span>${escapeHtml(u)}</span>
        </div>
      `).join('');
      count.textContent = `${users.length} online`;
    });

    // Prevent XSS
    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
