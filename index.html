<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Atmosphere Weather</title>
  <script src="https://cdn.tailwindcss.com"></script>
    <style>
    /* Prevent pull-to-refresh on mobile to allow custom swipe gestures */
    body {
      overscroll-behavior-y: contain;
      touch-action: none;
      background-color: #000;
    }
    
    /* Custom scrollbar for chat */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 10px;
    }

    /* Rain animation */
    @keyframes rain-drop {
      0% { transform: translateY(-10vh); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
    .rain-drop {
      position: absolute;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.6));
      width: 2px;
      height: 40px;
      animation: rain-drop linear infinite;
    }

    /* Snow animation */
    @keyframes snow-fall {
      0% { transform: translateY(-10vh) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(100vh) translateX(20px); opacity: 0; }
    }
    .snow-drop {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: snow-fall linear infinite;
    }

    /* Lightning Flash animation */
    @keyframes lightning-flash {
      0%, 95%, 100% { background-color: transparent; }
      96%, 98% { background-color: rgba(255, 255, 255, 0.5); }
      97% { background-color: transparent; }
    }
    .thunder-bg {
      animation: lightning-flash 7s infinite;
    }
  </style>
</head>
<body class="text-white overflow-hidden h-screen w-screen">
  <div id="root" class="h-full w-full"></div>
  <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
